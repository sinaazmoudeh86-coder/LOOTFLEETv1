<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LOOT FLEET — social card renderer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#181c26;font-family:'Rajdhani',sans-serif;color:#eaf0fa}
a{color:#9ad4ff}a:hover{color:#c2e5ff}
.card{width:1080px;height:1350px;overflow:hidden;position:relative;margin:0 auto 40px;background:radial-gradient(140% 90% at 50% 0%,#101a30,#070b16 55%,#04060d)}
.wrap{position:relative;padding:78px 84px;height:100%;display:flex;flex-direction:column}
.kick{font:800 22px 'Orbitron';letter-spacing:.34em;color:#f2a93c}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;border-top:1px solid #1d2a47;padding-top:30px}
.foot .l{font:800 26px 'Orbitron';letter-spacing:.12em;color:#9ad4ff}
.foot .r{font:700 24px 'Rajdhani';color:#6f7d99;letter-spacing:.06em}
h1{font:900 62px/1.04 'Orbitron';letter-spacing:.01em;margin:16px 0 8px}
.sub{font:700 26px 'Rajdhani';color:#8fa3bd;letter-spacing:.04em;margin-bottom:30px}
.rows{display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center;min-height:0}
.row{display:flex;align-items:center;gap:24px;border:1px solid #223052;border-radius:18px;padding:19px 28px;background:linear-gradient(90deg,rgba(20,29,50,.85),rgba(10,14,26,.6))}
.chip{min-width:78px;height:78px;border-radius:15px;display:grid;place-items:center;font:800 34px 'Orbitron';flex:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
.row b{font:800 32px 'Orbitron';letter-spacing:.04em;width:290px;flex:none}
.row p{font:600 27px/1.22 'Rajdhani';color:#b7c4da}
.row p em,.pitch em,.fact em{font-style:normal;color:#fff;font-weight:700}
.ship-wrap{text-align:center;display:flex;flex-direction:column;align-items:center;height:100%}
.ship-wrap h1{font-size:84px}
.ship-wrap .foot{width:100%}
.cls{font:800 28px 'Orbitron';letter-spacing:.22em;color:#f2a93c}
.art{max-height:470px;max-width:820px;object-fit:contain;margin:30px 0 8px;filter:drop-shadow(0 30px 60px rgba(90,160,255,.35))}
.pitch{font:700 30px/1.35 'Rajdhani';color:#b7c4da;max-width:800px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;margin:38px 0 0}
.st{border:1px solid #24345c;border-radius:16px;padding:22px 8px;background:rgba(14,20,38,.7)}
.st b{display:block;font:900 44px 'Orbitron';color:#9ad4ff}
.st span{font:700 19px 'Rajdhani';letter-spacing:.08em;color:#7f8fb0;text-transform:uppercase}
.badge{margin-top:32px;border:1px solid rgba(242,169,60,.55);border-radius:14px;padding:17px 32px;font:800 25px 'Rajdhani';letter-spacing:.12em;color:#ffd8a3;background:rgba(242,169,60,.08)}
.tip-wrap{justify-content:center;text-align:left;height:100%;display:flex;flex-direction:column}
.big{font:900 76px/1.05 'Orbitron';margin:26px 0 34px;max-width:880px}
.fact{font:700 44px/1.3 'Rajdhani';color:#dfe8f6;max-width:860px;border-left:6px solid var(--ac,#f2a93c);padding-left:34px}
.small{font:600 28px/1.4 'Rajdhani';color:#8fa3bd;max-width:820px;margin-top:34px}
.glow{position:absolute;left:50%;top:46%;width:980px;height:980px;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--ac,#f2a93c) 0%,transparent 62%);opacity:.09;pointer-events:none}
#idx{max-width:1140px;margin:30px auto;padding:0 20px;font:700 16px 'Rajdhani';color:#8fa3bd}
</style></head>
<body>
<div id="idx"></div>
<div id="stage"></div>
<script>
const esc = (s) => String(s);
function foot(){ return '<div class="foot"><span class="l">▸ PLAY FREE · LOOTFLEET.COM</span><span class="r">browser · no download</span></div>'; }
function render(c){
  if (c.type === 'list') return '<div class="card" id="c-' + c.slug + '"><div class="wrap">' +
    '<div class="kick">LOOT FLEET · ' + c.kick + '</div><h1>' + c.h1 + '</h1><div class="sub">' + c.sub + '</div>' +
    '<div class="rows">' + c.rows.map((r) => '<div class="row"><div class="chip" style="color:' + r.c + '">' + r.ic + '</div><b style="color:' + r.c + '">' + r.n + '</b><p>' + r.t + '</p></div>').join('') + '</div>' + foot() + '</div></div>';
  if (c.type === 'ship') return '<div class="card" id="c-' + c.slug + '"><div class="glow" style="--ac:#5a9fff"></div><div class="wrap ship-wrap">' +
    '<div class="kick">' + c.kick + '</div><h1>' + c.name + '</h1><div class="cls">' + c.cls + '</div>' +
    '<img class="art" src="../ships/' + c.art + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
    '<div class="pitch">' + c.pitch + '</div>' +
    '<div class="stats">' + c.stats.map((s) => '<div class="st"><b>' + s.v + '</b><span>' + s.k + '</span></div>').join('') + '</div>' +
    (c.badge ? '<div class="badge">' + c.badge + '</div>' : '') + foot() + '</div></div>';
  return '<div class="card" id="c-' + c.slug + '"><div class="glow" style="--ac:' + (c.c || '#f2a93c') + '"></div><div class="wrap tip-wrap" style="--ac:' + (c.c || '#f2a93c') + '">' +
    '<div class="kick">LOOT FLEET · ' + c.kick + '</div><div class="big">' + c.big + '</div>' +
    '<div class="fact">' + c.fact + '</div><div class="small">' + c.small + '</div>' + foot() + '</div></div>';
}
fetch('batch-01.json').then((r) => r.json()).then((b) => {
  const q = new URLSearchParams(location.search), one = q.get('slug');
  const cards = one ? b.cards.filter((c) => c.slug === one) : b.cards;
  document.getElementById('idx').textContent = one ? '' : 'BATCH 01 · ' + b.cards.length + ' cards · each 1080×1350 · snapshot ids: ' + b.cards.map((c) => '#c-' + c.slug).join('  ');
  document.getElementById('stage').innerHTML = cards.map(render).join('');
});
</script>
</body></html>
